<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pondes Pages · Hub</title>

  <!-- Script Oficial de Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8795730098491209"
     crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f6f8fa;
      color: #57606a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.5rem 1.5rem 1.8rem 1.5rem;
      text-align: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #24292f;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.8px;
    }

    .subtitle {
      font-size: 1.1rem;
      font-weight: 500;
      color: #57606a;
      margin-bottom: 2rem;
    }

    /* Barra de Telemetría en Vivo */
    .metrics-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-bottom: 2rem;
      font-size: 0.82rem;
      font-family: monospace;
      color: #57606a;
      background: #ffffff;
      border: 1px solid #d0d7de;
      padding: 0.55rem 1.2rem;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(31, 35, 40, 0.04);
    }

    .metric-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .metric-val {
      font-weight: 700;
      color: #24292f;
    }

    /* Grilla de Enlaces a Proyectos */
    .projects-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      width: 100%;
    }

    .project-chip {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: #24292f;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .project-chip:hover {
      border-color: #0969da;
      background: #f3f9ff;
      transform: translateY(-1px);
    }

    .chip-tecito {
      background: #fff8eb;
      border-color: #ffd085;
      color: #7c4a03;
    }

    .chip-tecito:hover {
      border-color: #e5971a;
      background: #fff1d6;
    }

    /* Bloque Google AdSense */
    .ad-slot-wrapper {
      width: 100%;
      max-width: 600px;
      min-height: 100px;
      margin: 1.5rem 0 2rem 0;
      padding: 0.6rem;
      background: #ffffff;
      border: 1px dashed #d0d7de;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ad-label {
      font-size: 0.65rem;
      color: #8c959f;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
    }

    .divider {
      color: #d0d7de;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      margin-bottom: 0.8rem;
      font-size: 0.85rem;
    }

    .footer-links a {
      color: #0969da;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .github-logo {
      display: inline-block;
      color: #8c959f;
      transition: color 0.2s ease;
    }

    .github-logo:hover {
      color: #24292f;
    }

    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.82rem;
      color: #8c959f;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hub</h1>
    <div class="subtitle">Herramientas web</div>

    <!-- Datos en vivo: Japón, Alaska y Dólar Tarjeta -->
    <div class="metrics-bar">
      <div class="metric-item">
        <span>🇯🇵 Tokio:</span>
        <span id="japan-weather" class="metric-val">Cargando...</span>
      </div>
      <span class="divider">|</span>
      <div class="metric-item">
        <span>❄️ Alaska (AKST):</span>
        <span id="alaska-clock" class="metric-val">--:--:--</span>
      </div>
      <span class="divider">|</span>
      <div class="metric-item">
        <span>💳 Dólar Tarjeta:</span>
        <span id="dolar-tarjeta" class="metric-val">$ --</span>
      </div>
    </div>

    <!-- Grilla de proyectos y soporte -->
    <div class="projects-grid">
      <a href="sushi/" class="project-chip">🍣 Contador de Sushi</a>
      <a href="pizza/" class="project-chip">🍕 Contador de Pizza</a>
      <a href="arte/" class="project-chip">🎨 Mia Art</a>
      <a href="luli/" class="project-chip">L</a>
      <a href="https://tecito.app/pondes" target="_blank" rel="noopener noreferrer" class="project-chip chip-tecito">☕ Invitame un Tecito</a>
    </div>

    <!-- Bloque de Google AdSense -->
    <div class="ad-slot-wrapper">
      <span class="ad-label">Anuncio</span>
      <ins class="adsbygoogle"
           style="display:block; width:100%;"
           data-ad-client="ca-pub-8795730098491209"
           data-ad-slot="auto"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="https://mateodespontin.github.io/Pondes">Inicio</a>
      <span class="divider">·</span>
      <a href="https://tecito.app/pondes" target="_blank" rel="noopener noreferrer">Tecito</a>
      <span class="divider">·</span>
      <a href="https://github.com/mateodespontin" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
    <a href="https://github.com/mateodespontin" class="github-logo" title="@mateodespontin" target="_blank" rel="noopener noreferrer">
      <svg height="28" width="28" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
    </a>
    <span>Pondes Pages © 2026 · Desarrollado por @mateodespontin</span>
  </footer>

  <script>
    function updateAlaskaClock() {
      const now = new Date();
      const options = {
        timeZone: 'America/Anchorage',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      document.getElementById('alaska-clock').textContent = now.toLocaleTimeString('es-AR', options);
    }
    setInterval(updateAlaskaClock, 1000);
    updateAlaskaClock();

    async function fetchJapanWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current=temperature_2m');
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        document.getElementById('japan-weather').textContent = `${temp} °C`;
      } catch {
        document.getElementById('japan-weather').textContent = 'N/D';
      }
    }
    fetchJapanWeather();
    setInterval(fetchJapanWeather, 600000);

    async function fetchDolarTarjeta() {
      try {
        const res = await fetch('https://dolarapi.com/v1/dolares/tarjeta');
        const data = await res.json();
        const price = data.venta.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('dolar-tarjeta').textContent = `$ ${price}`;
      } catch {
        document.getElementById('dolar-tarjeta').textContent = '$ --';
      }
    }
    fetchDolarTarjeta();
    setInterval(fetchDolarTarjeta, 300000);
  </script>

</body>
</html>
