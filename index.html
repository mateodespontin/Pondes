<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      padding: 2.5rem 1.5rem;
    }

    .hero-404 {
      text-align: center;
      margin-bottom: 3rem;
    }

    .glitch-code {
      font-size: clamp(5rem, 14vw, 8.5rem);
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .hero-404 h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }

    .hero-404 p {
      font-size: 1rem;
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.5;
      margin: 0 auto;
    }

    /* Contenedor de proyectos */
    .projects-container {
      width: 100%;
      max-width: 680px;
    }

    .projects-header {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      margin-bottom: 1.2rem;
      text-align: center;
    }

    .grid-projects {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Tarjeta interactiva de proyecto */
    .project-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151d2f;
      border: 1px solid #1e293b;
      padding: 1.2rem 1.4rem;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    .project-card:hover {
      background: #1e293b;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .project-info h2 {
      font-size: 1.15rem;
      color: #f8fafc;
      margin-bottom: 0.3rem;
    }

    .project-info p {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .arrow {
      font-size: 1.4rem;
      color: #38bdf8;
      transition: transform 0.2s ease;
    }

    .project-card:hover .arrow {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <!-- Encabezado 404 -->
  <section class="hero-404">
    <div class="glitch-code">404</div>
    <h1>Ups, nada por aquí... ¿o sí?</h1>
    <p>Parece que llegaste a una página vacía, pero puedes explorar los proyectos que tengo montados:</p>
  </section>

  <!-- Lista de proyectos -->
  <section class="projects-container">
    <h2 class="projects-header">Proyectos interactivos</h2>
    
    <div class="grid-projects">
      <!-- Proyecto Pondes -->
      <a href="https://mateodespontin.github.io/Pondes/" class="project-card" target="_blank" rel="noopener noreferrer">
        <div class="project-info">
          <h2>Pondes</h2>
          <p>Visualizador y demo interactiva en GitHub Pages</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>

      <!-- Puedes duplicar este bloque para agregar más proyectos -->
      <!--
      <a href="https://marvelous-bombolone-35ba51.netlify.app/" class="project-card" target="_blank" rel="noopener noreferrer">
        <div class="project-info">
          <h2>Proyecto Netlify</h2>
          <p>Demo interactiva en producción</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
      -->
    </div>
  </section>

</body>
</html>
