<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Proyectos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      padding: 2.5rem 1.5rem;
    }

    .hero-404 {
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .glitch-code {
      font-size: clamp(5.5rem, 15vw, 8.5rem);
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .hero-404 h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }

    .hero-404 p {
      font-size: 1rem;
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.5;
      margin: 0 auto;
    }

    .projects-container {
      width: 100%;
      max-width: 650px;
    }

    .projects-header {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #64748b;
      margin-bottom: 1.2rem;
      text-align: center;
    }

    .grid-projects {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .project-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151d2f;
      border: 1px solid #1e293b;
      padding: 1.25rem 1.4rem;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .project-card:hover {
      background: #1e293b;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .project-info h2 {
      font-size: 1.15rem;
      color: #f8fafc;
      margin-bottom: 0.35rem;
    }

    .project-info p {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .arrow {
      font-size: 1.4rem;
      color: #38bdf8;
      transition: transform 0.2s ease;
    }

    .project-card:hover .arrow {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <section class="hero-404">
    <div class="glitch-code">404</div>
    <h1>Ups, nada por aquí... ¿o sí?</h1>
    <p>Llegaste a una página en construcción, pero puedes explorar los proyectos activos:</p>
  </section>

  <section class="projects-container">
    <h2 class="projects-header">Proyectos disponibles</h2>
    
    <div class="grid-projects">
      <!-- Arte -->
      <a id="link-arte" href="#" class="project-card">
        <div class="project-info">
          <h2>Galería / Mia Art</h2>
          <p>Explorar el proyecto y catálogo de arte</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>

      <!-- Luli -->
      <a id="link-luli" href="#" class="project-card">
        <div class="project-info">
          <h2>Hola Luli v6</h2>
          <p>Script Python, notas y acertijo</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>

      <!-- Pondes -->
      <a href="https://mateodespontin.github.io/Pondes/" class="project-card" target="_blank" rel="noopener noreferrer">
        <div class="project-info">
          <h2>Pondes</h2>
          <p>Demo interactiva en GitHub Pages</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </section>

  <!-- Script que autodetecta el repositorio exacto -->
  <script>
    (function() {
      // Obtiene el path base (ej: /nombre-repo/) sin importar dónde esté alojado
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const basePath = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      
      document.getElementById('link-arte').href = basePath + 'arte.html';
      document.getElementById('link-luli').href = basePath + 'luli.html';
    })();
  </script>

</body>
</html>
