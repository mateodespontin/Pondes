# ¿Juega Messi hoy? — todo en un solo archivo.
# Va en el repo Pondes, en: .github/workflows/messi.yml
# Genera la carpeta messi-hoy/ con la página, 4 veces por día (10, 17, 20 y 23 hs de Argentina).

name: Juega Messi hoy

on:
  schedule:
    - cron: "0 13,20,23,2 * * *"   # en hora UTC = 10, 17, 20 y 23 hs de Argentina
  workflow_dispatch:                # botón para correrlo a mano
  push:
    branches: [main]
    paths: [".github/workflows/messi.yml"]

permissions:
  contents: write

concurrency:
  group: messi-hoy
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar la página
        env:
          CARPETA: messi-hoy
        run: |
          # si quedó un archivo suelto llamado "messi-hoy", lo borra para poder crear la carpeta
          if [ -f messi-hoy ]; then git rm -q messi-hoy; fi
          cat > /tmp/check.py <<'PY'
          """
          ¿Juega Messi hoy?
          Consulta los datos públicos de ESPN (gratis, sin clave) y genera public/index.html.
          Solo usa librerías que vienen con Python: no hay que instalar nada.
          """
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          ARG = timezone(timedelta(hours=-3))  # Argentina no tiene horario de verano
          MESSI_ID = "45843"  # id de Messi en ESPN

          # (liga en ESPN, id del equipo). Inter Miami = 20232, Argentina = 202
          EQUIPOS = [
              ("usa.1", "20232"),                 # MLS (incluye playoffs)
              ("concacaf.champions", "20232"),    # Concachampions
              ("concacaf.leagues.cup", "20232"),  # Leagues Cup
              ("usa.open", "20232"),              # US Open Cup
              ("fifa.cwc", "20232"),              # Mundial de Clubes
              ("fifa.friendly", "20232"),         # amistosos de clubes
              ("fifa.friendly", "202"),           # Argentina: amistosos
              ("fifa.worldq.conmebol", "202"),    # Argentina: Eliminatorias
              ("conmebol.america", "202"),        # Argentina: Copa América
              ("fifa.world", "202"),              # Argentina: Mundial
              ("uefa.conmebol.finalissima", "202"),
          ]

          BASE = "https://site.api.espn.com/apis/site/v2/sports/soccer"


          def get_json(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.load(r)
              except Exception as e:
                  print("No se pudo leer", url, "->", e)
                  return None


          def partidos():
              """Junta todos los partidos (pasados y futuros) de Inter Miami y Argentina."""
              todos = {}
              for liga, equipo in EQUIPOS:
                  for extra in ("", "?fixture=true"):
                      data = get_json(f"{BASE}/{liga}/teams/{equipo}/schedule{extra}")
                      if not data:
                          continue
                      for ev in data.get("events", []):
                          try:
                              comp = ev["competitions"][0]
                              fecha = datetime.fromisoformat(ev["date"].replace("Z", "+00:00")).astimezone(ARG)
                              equipos = []
                              for c in comp["competitors"]:
                                  score = c.get("score")
                                  if isinstance(score, dict):
                                      score = score.get("displayValue")
                                  equipos.append({
                                      "nombre": c["team"]["displayName"],
                                      "local": c.get("homeAway") == "home",
                                      "goles": score,
                                  })
                              equipos.sort(key=lambda x: not x["local"])  # local primero
                              todos[ev["id"]] = {
                                  "id": ev["id"],
                                  "liga": liga,
                                  "fecha": fecha,
                                  "estado": comp.get("status", {}).get("type", {}).get("state", "pre"),
                                  "torneo": (ev.get("league") or {}).get("name")
                                            or (ev.get("season") or {}).get("displayName", ""),
                                  "equipos": equipos,
                              }
                          except Exception as e:
                              print("Partido con formato raro, lo salteo:", e)
              return sorted(todos.values(), key=lambda p: p["fecha"])


          def situacion_messi(p):
              """Devuelve 'titular', 'suplente', 'entro', 'no_convocado' o None si todavía no hay formación."""
              data = get_json(f"{BASE}/{p['liga']}/summary?event={p['id']}")
              if not data:
                  return None
              rosters = data.get("rosters") or []
              hay_formacion = any(r.get("roster") for r in rosters)
              if not hay_formacion:
                  return None
              for r in rosters:
                  for j in r.get("roster") or []:
                      a = j.get("athlete") or {}
                      if str(a.get("id")) == MESSI_ID or "Messi" in (a.get("displayName") or ""):
                          if j.get("starter"):
                              return "titular"
                          if j.get("subbedIn"):
                              return "entro"
                          return "suplente"
              return "no_convocado"


          def texto_partido(p):
              a, b = p["equipos"][0], p["equipos"][1]
              if p["estado"] in ("in", "post") and a["goles"] is not None:
                  return f"{a['nombre']} {a['goles']} - {b['goles']} {b['nombre']}"
              return f"{a['nombre']} vs. {b['nombre']}"


          DIAS = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"]
          MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio",
                   "agosto", "septiembre", "octubre", "noviembre", "diciembre"]


          def fecha_linda(d):
              return f"{DIAS[d.weekday()]} {d.day} de {MESES[d.month - 1]}, {d:%H:%M} hs"


          def armar():
              ahora = datetime.now(ARG)
              lista = partidos()
              hoy = [p for p in lista if p["fecha"].date() == ahora.date()]
              proximos = [p for p in lista if p["fecha"] > ahora and p["fecha"].date() != ahora.date()]

              if not hoy:
                  respuesta, color = "NO", "no"
                  detalle = "Hoy no hay partido."
                  p = None
              else:
                  p = hoy[0]
                  messi = situacion_messi(p)
                  hora = f"{p['fecha']:%H:%M} hs"
                  if p["estado"] == "post":
                      if messi in ("titular", "entro"):
                          respuesta, color = "JUGÓ", "si"
                          detalle = "Fue titular." if messi == "titular" else "Entró desde el banco."
                      elif messi == "suplente":
                          respuesta, color = "NO JUGÓ", "no"
                          detalle = "Estuvo en el banco pero no entró."
                      else:
                          respuesta, color = "NO JUGÓ", "no"
                          detalle = "No estuvo en el partido."
                  elif messi == "titular":
                      respuesta, color = "SÍ", "si"
                      detalle = f"Es titular. {'¡Está jugando ahora!' if p['estado'] == 'in' else 'Arranca a las ' + hora + '.'}"
                  elif messi in ("suplente", "entro"):
                      respuesta, color = "EN EL BANCO", "quizas"
                      detalle = "Ya entró a la cancha." if messi == "entro" else f"Arranca como suplente. Partido a las {hora}."
                  elif messi == "no_convocado":
                      respuesta, color = "NO", "no"
                      detalle = "Hay partido pero Messi no está en la lista."
                  else:
                      respuesta, color = "PROBABLEMENTE", "quizas"
                      detalle = f"Hay partido a las {hora}. La formación sale 1 hora antes."

              partido_html = ""
              if p:
                  partido_html = f"""<div class="card"><div class="lbl">Partido de hoy</div>
          <div class="match">{texto_partido(p)}</div><div class="sub">{p['torneo']} · {p['fecha']:%H:%M} hs</div></div>"""
              prox_html = ""
              if proximos:
                  q = proximos[0]
                  prox_html = f"""<div class="card"><div class="lbl">Próximo partido</div>
          <div class="match">{texto_partido(q)}</div><div class="sub">{q['torneo']} · {fecha_linda(q['fecha'])}</div></div>"""

              html = f"""<!doctype html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="600">
          <title>¿Juega Messi hoy?</title>
          <meta property="og:title" content="¿Juega Messi hoy? {respuesta}">
          <meta property="og:description" content="{detalle}">
          <style>
          :root{{--bg:#f4f8fc;--fg:#0f1b2d;--muted:#5b6b80;--card:#fff;--line:#dde6f0;
          --si:#1f9d55;--no:#c0392b;--quizas:#d68910}}
          @media (prefers-color-scheme:dark){{:root{{--bg:#0d1520;--fg:#eef3f9;--muted:#93a4ba;--card:#16212f;--line:#24344a}}}}
          *{{box-sizing:border-box}}
          body{{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
          min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}}
          h1{{font-size:1.1rem;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.02em}}
          .big{{font-size:clamp(3.5rem,18vw,8rem);font-weight:900;line-height:1;margin:8px 0 12px}}
          .si{{color:var(--si)}}.no{{color:var(--no)}}.quizas{{color:var(--quizas)}}
          .det{{font-size:1.2rem;margin:0 0 28px;max-width:480px}}
          .card{{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:0 0 12px;width:100%;max-width:420px}}
          .lbl{{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}}
          .match{{font-weight:700;font-size:1.1rem}}.sub{{color:var(--muted);font-size:.9rem;margin-top:4px}}
          footer{{margin-top:20px;font-size:.8rem;color:var(--muted)}}
          </style></head><body>
          <h1>¿Juega Messi hoy?</h1>
          <div class="big {color}">{respuesta}</div>
          <p class="det">{detalle}</p>
          {partido_html}
          {prox_html}
          <footer><a href="../" style="color:inherit">← Volver al Hub</a><br><br>Actualizado: {fecha_linda(ahora)} (hora Argentina) · Datos: ESPN</footer>
          </body></html>"""

              carpeta = os.environ.get("CARPETA", "public")
              os.makedirs(carpeta, exist_ok=True)
              with open(os.path.join(carpeta, "index.html"), "w", encoding="utf-8") as f:
                  f.write(html)
              print("Listo:", respuesta, "-", detalle)


          if __name__ == "__main__":
              armar()
          PY
          python3 /tmp/check.py

      - name: Guardar en el repo
        run: |
          git config user.name "messi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A messi-hoy
          git commit -q -m "Actualiza ¿Juega Messi hoy?" || exit 0
          git pull -q --rebase
          git push -q
