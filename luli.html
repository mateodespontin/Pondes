<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hola Luli v6.txt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      line-height: 1.5;
      padding: 1.5rem 1rem 4rem 1rem;
      position: relative;
      min-height: 100vh;
    }
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.25;
    }
    .raw-txt {
      position: relative;
      z-index: 1;
      max-width: 740px;
      margin: 0 auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #ffffff;
    }
    .inline-form {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      vertical-align: middle;
      margin: 0 4px;
    }
    .input-raw {
      background: #090909;
      border: 1px solid #444444;
      color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      padding: 2px 6px;
      outline: none;
      vertical-align: middle;
    }
    .input-raw:focus { border-color: #00ff66; }
    .btn-raw {
      background: #111111;
      border: 1px solid #00ff66;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      font-size: 10px;
      padding: 2px 8px;
      cursor: pointer;
      vertical-align: middle;
    }
    .btn-raw:hover { background: #003311; }
    .btn-success {
      background: #00441b !important;
      border-color: #00ff66 !important;
      color: #ffffff !important;
      cursor: default;
    }
    .audio-tag-bar {
      margin-bottom: 1.2rem;
      border-bottom: 1px dashed #222222;
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .audio-toggle-btn {
      background: #051408;
      border: 1px solid #00ff66;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      font-size: 10px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .audio-toggle-btn:hover { background: #003311; }

    /* Coordenadas minimalistas al final */
    .coords-container {
      margin-top: 3rem;
      text-align: center;
    }
    .coords-val {
      color: #1a1a1a;
      font-size: 11px;
      letter-spacing: 0.1em;
      font-family: "Courier New", Courier, monospace;
      transition: color 0.5s ease;
    }
    .coords-val.revealed {
      color: #00ff66;
      font-size: 12px;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
      user-select: all;
      -webkit-user-select: all;
      cursor: pointer;
    }

    /* Login Overlay Terminal */
    #login-overlay {
      position: relative;
      z-index: 10;
      max-width: 480px;
      margin: 12vh auto 0 auto;
      border: 1px solid #1a3320;
      background: #050a06;
      padding: 1.5rem;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.1);
    }
    .login-header {
      border-bottom: 1px dashed #1a3320;
      padding-bottom: 0.6rem;
      margin-bottom: 1.2rem;
      color: #00ff66;
      font-size: 11px;
    }
    .login-row {
      margin-bottom: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .login-label {
      color: #888888;
      font-size: 10px;
    }
    .login-input {
      background: #000000;
      border: 1px solid #333333;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
      width: 100%;
    }
    .login-input:focus { border-color: #00ff66; }
    .login-btn {
      background: #00220d;
      border: 1px solid #00ff66;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      padding: 6px 14px;
      cursor: pointer;
      margin-top: 0.4rem;
      width: 100%;
    }
    .login-btn:hover { background: #00441b; }
    .login-msg {
      margin-top: 0.8rem;
      font-size: 10px;
      color: #ff5555;
      min-height: 16px;
    }
  </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<audio id="bg-music" loop preload="auto">
  <source src="./musica.mp3" type="audio/mpeg">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- Pantalla de Login Terminal -->
<div id="login-overlay">
  <div class="login-header">[auth_gateway // terminal v6]</div>
  <form id="auth-form" onsubmit="handleAuth(event)">
    <div class="login-row">
      <span class="login-label">USUARIO:</span>
      <input type="text" class="login-input" value="lulimoti@hotmail.com" readonly style="color: #aaaaaa; background: #080808; cursor: not-allowed;">
    </div>
    <div class="login-row">
      <span class="login-label">CONTRASEÑA:</span>
      <input type="password" id="login-pass" class="login-input" placeholder="ingrese contraseña..." autocomplete="off" autofocus required>
    </div>
    <button type="submit" class="login-btn">[ INGRESAR ]</button>
    <div id="login-msg" class="login-msg"></div>
  </form>
</div>

  function decodeBase64Utf8(b64) {
    const binStr = atob(b64);
    const bytes = new Uint8Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) {
      bytes[i] = binStr.charCodeAt(i);
    }
    return new TextDecoder('utf-8').decode(bytes);

  // Lógica del Login
  let intentos = 0;
  const PASSWORD_CORRECTA = "luli";

  function unlockSite() {
    document.getElementById('login-overlay').style.display = 'none';
    const root = document.getElementById('app-root');
    root.innerHTML = decodeBase64Utf8(_kData);
    root.style.display = 'block';
    activarAudio();
  }

  function handleAuth(e) {
    e.preventDefault();
    activarAudio();
    intentos++;

    const passInput = document.getElementById('login-pass');
    const msg = document.getElementById('login-msg');
    const pass = passInput.value.trim().toLowerCase();

    if (pass === PASSWORD_CORRECTA || intentos >= 3) {
      msg.style.color = '#00ff66';
      msg.textContent = 'ACCESO CONCEDIDO...';
      passInput.disabled = true;
      setTimeout(() => {
        unlockSite();
      }, 700);
    } else {
      const restantes = 3 - intentos;
      msg.style.color = '#ff5555';
      msg.textContent = 'Contraseña errónea. Intente nuevamente.';
      passInput.value = '';
      passInput.focus();
    }
  }

  // Audio Control
  const audio = document.getElementById('bg-music');
  let audioStarted = false;

  function activarAudio() {
    if (!audioStarted) {
      audio.play().then(() => {
        audioStarted = true;
        const btn = document.getElementById('sound-btn');
        if (btn) {
          btn.textContent = '[♪ audio: ON]';
          btn.style.color = '#00ff66';
        }
      }).catch(() => {});
    }
  }

  function toggleMusica() {
    const btn = document.getElementById('sound-btn');
    if (audio.paused) {
      audio.play().then(() => {
        audioStarted = true;
        if (btn) btn.textContent = '[♪ audio: ON]';
      }).catch(() => {
        alert("Sube el archivo 'musica.mp3' en la raíz del repositorio.");
      });
    } else {
      audio.pause();
      if (btn) btn.textContent = '[♪ audio: OFF]';
    }
  }

  window.addEventListener('click', activarAudio, { once: true });
  window.addEventListener('touchstart', activarAudio, { once: true });
  window.addEventListener('keydown', activarAudio, { once: true });

  // Matrix Background Animation
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*+-/=';
  const size = 13;
  let cols = Math.floor(canvas.width / size);
  let drops = Array(cols).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00bb44';
    ctx.font = size + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const char = chars.charAt(Math.floor(Math.random() * chars.length));
      ctx.fillText(char, i * size, drops[i] * size);
      if (drops[i] * size > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 35);

  // Lógica de Validación y Coordenadas al Final
  const estado = { q1: false, qSola: false, q2: false };
  const _c0 = "NDHCsDQzJzU3LjAiTiA0OcKwNTYnNDkuMCJX"; // 41°43'57.0"N  49°56'49.0"W

  function descifrarPistas() {
    const raw = decodeBase64Utf8(_c0);
    const coordsEl = document.getElementById('coords-text');
    if (coordsEl) {
      coordsEl.textContent = raw;
      coordsEl.classList.add('revealed');
      setTimeout(() => {
        document.getElementById('coords-display').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 250);
    }
  }

  function checkCompleto() {
    if (estado.q1 && estado.qSola && estado.q2) {
      descifrarPistas();
    }
  }

  function enviarForm(e, inId, btnId, key) {
    e.preventDefault();
    activarAudio();
    document.getElementById(inId).disabled = true;
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    btn.classList.add('btn-success');
    btn.textContent = '✔ ok';
    estado[key] = true;
    checkCompleto();
  }

  function enviarFormDoble(e, in1Id, in2Id, btnId, key) {
    e.preventDefault();
    activarAudio();
    document.getElementById(in1Id).disabled = true;
    document.getElementById(in2Id).disabled = true;
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    btn.classList.add('btn-success');
    btn.textContent = '✔ ok';
    estado[key] = true;
    checkCompleto();
  }
</script>

</body>
