<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Password // The Challenge</title>

  <meta name="theme-color" content="#f6f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PasswordGame">

  <!-- Favicon e Icono PWA -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='20' y='30' width='60' height='45' rx='8' fill='%2324292f'/><circle cx='50' cy='50' r='8' fill='%23fff'/></svg>">
  
  <!-- Script oficial de Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8795730098491209" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-main: #f6f8fa;
      --card-bg: #ffffff;
      --card-border: #d0d7de;
      --text-main: #24292f;
      --text-muted: #57606a;
      --accent-blue: #0969da;
      --success-green: #1a7f37;
      --error-red: #cf222e;
      --error-bg: #ffebe9;
      --success-bg: #dafbe1;
      --shadow-sm: 0 1px 3px rgba(31, 35, 40, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1.2rem 1.8rem 1.2rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    /* Botón Home idéntico al resto del Hub */
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 0.2rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-decoration: none;
      color: var(--text-main);
      padding: 6px 16px;
      border: 1px solid var(--card-border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }

    .btn-home span {
      font-size: 1.1rem;
      font-weight: 300;
    }

    .btn-home:hover {
      background: #ffffff;
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    header {
      text-align: center;
      width: 100%;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Input principal de contraseña */
    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      padding: 1.2rem;
      box-shadow: var(--shadow-sm);
    }

    .password-input {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1.1rem;
      font-family: monospace;
      font-weight: 600;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      outline: none;
      background: #fafbfc;
      color: var(--text-main);
      transition: border-color 0.15s ease;
    }

    .password-input:focus {
      border-color: var(--accent-blue);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
    }

    /* Contenedor de Reglas */
    .rules-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .rule-card {
      background: var(--error-bg);
      border: 1px solid #f85149;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--error-red);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .rule-card.passed {
      background: var(--success-bg);
      border-color: #2ea043;
      color: var(--success-green);
    }

    .rule-icon {
      font-size: 1rem;
      font-weight: 700;
    }

    /* Mensaje de Victoria */
    .win-box {
      display: none;
      background: var(--success-bg);
      border: 2px solid #2ea043;
      border-radius: 14px;
      padding: 1.4rem;
      text-align: center;
      width: 100%;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .win-box h2 {
      color: var(--success-green);
      font-size: 1.4rem;
      margin-bottom: 0.4rem;
    }

    .win-box p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Publicidad AdSense */
    .ad-wrapper {
      width: 100%;
      min-height: 90px;
      border-radius: 12px;
      border: 1px dashed var(--card-border);
      background: rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }

    .ad-label {
      font-size: 0.62rem;
      color: #8c959f;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.2rem;
    }

    footer {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1rem;
    }

    footer a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Botón Home Superior -->
    <nav class="top-nav">
      <a href="https://mateodespontin.github.io/Pondes" class="btn-home">
        <span>←</span> Home
      </a>
    </nav>

    <header>
      <h1>Password Game</h1>
      <p>Crea una contraseña superando todas las reglas</p>
    </header>

    <!-- Tarjeta de Entrada -->
    <div class="input-card">
      <input type="text" id="pwd-input" class="password-input" placeholder="Escribe tu contraseña..." autocomplete="off" spellcheck="false">
    </div>

    <!-- Lista de Reglas Dinámicas -->
    <div class="rules-container" id="rules-list">
      <!-- Se inyectan por JS -->
    </div>

    <!-- Caja de Victoria -->
    <div class="win-box" id="win-box">
      <h2>🎉 ¡Contraseña Aprobada!</h2>
      <p>Sobreviviste a todas las reglas del sistema con éxito.</p>
    </div>

    <!-- Publicidad AdSense -->
    <div class="ad-wrapper">
      <span class="ad-label">Publicidad</span>
      <ins class="adsbygoogle"
           style="display:block; width:100%; text-align:center;"
           data-ad-client="ca-pub-8795730098491209"
           data-ad-slot="auto"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>

  </div>

  <footer>
    <p><a href="https://mateodespontin.github.io/Pondes">← Volver al Hub</a></p>
  </footer>

  <script>
    const input = document.getElementById('pwd-input');
    const rulesList = document.getElementById('rules-list');
    const winBox = document.getElementById('win-box');

    // Definición de las reglas del juego
    const rules = [
      {
        id: 1,
        text: "Tu contraseña debe tener al menos 5 caracteres.",
        check: (val) => val.length >= 5
      },
      {
        id: 2,
        text: "Tu contraseña debe incluir un número.",
        check: (val) => /\d/.test(val)
      },
      {
        id: 3,
        text: "Tu contraseña debe incluir una letra mayúscula.",
        check: (val) => /[A-Z]/.test(val)
      },
      {
        id: 4,
        text: "Tu contraseña debe incluir un carácter especial (ej: @, !, #).",
        check: (val) => /[^A-Za-z0-9]/.test(val)
      },
      {
        id: 5,
        text: "Los dígitos en tu contraseña deben sumar exactamente 25.",
        check: (val) => {
          const digits = val.match(/\d/g);
          if (!digits) return false;
          const sum = digits.reduce((acc, d) => acc + parseInt(d, 10), 0);
          return sum === 25;
        }
      },
      {
        id: 6,
        text: "Tu contraseña debe incluir un mes del año (en inglés o español: Enero, Febrero, etc.).",
        check: (val) => {
          const months = [
            "enero", "febrero", "marzo", "abril", "mayo", "junio",
            "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre",
            "january", "february", "march", "april", "may", "june",
            "july", "august", "september", "october", "november", "december"
          ];
          const lower = val.toLowerCase();
          return months.some(m => lower.includes(m));
        }
      }
    ];

    function evaluateGame() {
      const val = input.value;
      let activeRulesCount = 0;
      let allPassed = true;

      rulesList.innerHTML = '';

      for (let i = 0; i < rules.length; i++) {
        const rule = rules[i];
        
        // Determinar si esta regla debe mostrarse (se desbloquean secuencialmente)
        // Para que se desbloquee la regla i, la regla i-1 debe estar cumplida.
        if (i > 0) {
          let previousPassed = true;
          for (let j = 0; j < i; j++) {
            if (!rules[j].check(val)) {
              previousPassed = false;
              break;
            }
          }
          if (!previousPassed) break;
        }

        activeRulesCount++;
        const passed = rule.check(val);
        if (!passed) allPassed = false;

        const card = document.createElement('div');
        card.className = `rule-card ${passed ? 'passed' : ''}`;
        card.innerHTML = `
          <span>Regla ${rule.id}: ${rule.text}</span>
          <span class="rule-icon">${passed ? '✓' : '✕'}</span>
        `;
        rulesList.appendChild(card);

        // Si la regla actual falla, no mostramos las siguientes
        if (!passed) break;
      }

      // Si pasaron todas las reglas habilitadas y completaron el total de reglas
      if (allPassed && activeRulesCount === rules.length) {
        winBox.style.display = 'block';
      } else {
        winBox.style.display = 'none';
      }
    }

    input.addEventListener('input', evaluateGame);

    // Inicializar estado
    evaluateGame();
  </script>

</body>
</html>
